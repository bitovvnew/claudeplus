<!doctype html>
<html><head><meta charset="utf-8"><title>ClaudePlus banner</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: #f4f2ec; color: #16161a; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; position: relative; }
  .rule { position: absolute; left: 72px; right: 72px; height: 1px; background: rgba(22,22,26,.14); }
  .top { top: 64px; } .bot { bottom: 64px; }
  .meta { position: absolute; top: 34px; left: 72px; right: 72px; display: flex; justify-content: space-between; font: 500 14px/1 "Cascadia Mono", Consolas, monospace; color: #6b6a64; letter-spacing: .02em; }
  .foot { position: absolute; bottom: 30px; left: 72px; right: 72px; display: flex; justify-content: space-between; font: 500 14px/1 "Cascadia Mono", Consolas, monospace; color: #6b6a64; }
  .bot-art { position: absolute; right: 96px; top: 128px; width: 352px; height: 352px; image-rendering: pixelated; }
  .copy { position: absolute; left: 72px; top: 132px; width: 700px; }
  h1 { margin: 0; font-size: 104px; line-height: .95; letter-spacing: -.045em; font-weight: 800; }
  h1 .plus { color: #13a86a; }
  p.lead { margin: 30px 0 0; font-size: 28px; line-height: 1.34; letter-spacing: -.01em; color: #2b2b30; max-width: 600px; }
  .facts { margin-top: 36px; display: grid; grid-template-columns: repeat(4, auto); gap: 0 34px; justify-content: start; }
  .facts b { display: block; font-size: 34px; letter-spacing: -.03em; }
  .facts span { font: 500 13px/1.3 "Cascadia Mono", Consolas, monospace; color: #6b6a64; text-transform: uppercase; letter-spacing: .06em; }
  .term { position: absolute; right: 72px; bottom: 96px; width: 470px; background: #16161a; color: #f0efe9; border-radius: 10px; padding: 14px 16px; font: 14px/1.5 "Cascadia Mono", Consolas, monospace; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
  .term .g { color: #1ec97e } .term .m { color: #8a8880 } .term .y { color: #f2b33d } .term .b { font-weight: 700 }
</style></head>
<body>
  <div class="meta"><span>CLAUDEPLUS · v0.1.1</span><span>OPEN SOURCE · MIT</span></div>
  <div class="rule top"></div>
  <div class="copy">
    <h1>Claude<span class="plus">Plus</span></h1>
    <p class="lead">Know what every Claude Code session costs. Stop the habits that burn tokens. Run a team of 94 agents.</p>
    <div class="facts">
      <div><b>0</b><span>dependencies</span></div>
      <div><b>94</b><span>agents</span></div>
      <div><b>18</b><span>skills</span></div>
      <div><b>17</b><span>languages</span></div>
    </div>
  </div>
  <svg class="bot-art" viewBox="0 0 13 13" shape-rendering="crispEdges"><path fill="#1ec97e" d="M6 0h1v1h1v1H7v1H6V2H5V1h1z"/><rect x="6" y="3" width="1" height="1" fill="#16161a"/><path fill="#16161a" d="M2 4h9v1h1v2h1v2h-1v2h-1v1H2v-1H1V9H0V7h1V5h1z"/><rect x="2" y="5" width="9" height="6" fill="#fffdf9"/><rect x="3" y="6" width="7" height="4" fill="#16161a"/><path fill="#1ec97e" d="M4 7h1v1H4zM8 7h1v1H8zM5 9h3v1H5z"/></svg>
  <div class="term"><span class="g">◆</span> <span class="b">Opus 5.5</span><span class="m"> │ </span><span class="g">▰▰▰▱▱▱▱▱ 38%</span><span class="m"> │ session </span><span class="b">$4.12</span><span class="m"> │ </span><span class="y">$2.06/h</span></div>
  <div class="rule bot"></div>
  <div class="foot"><span>npm link &amp;&amp; cplus</span><span>github.com/bitovvnew/claudeplus</span></div>
</body></html>
